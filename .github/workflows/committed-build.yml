name: Committed build

# public/assets/js/inertia-app.js and public/assets/css/inertia-app.css are checked in,
# because hosts receive them as they are. Nothing else rebuilds them, so a source change
# merged without a rebuild ships a bundle that no longer matches its source (I-F3).
#
# This rebuilds from the pull request's tree and fails if the output differs from what is
# committed. No path filter: a required check that never reports blocks the merge for good.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-build:
    name: Committed bundle matches a fresh build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # No lock file is committed (org rule). --no-package-lock keeps a stale local lock
      # from pinning an old git dependency, matching how the bundle is built by hand.
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build the browser bundle
        run: npm run build:prod

      - name: Compare with the committed bundle
        run: |
          if ! git diff --exit-code --stat public/assets; then
            echo "::error title=Committed bundle is stale::public/assets differs from a fresh build of this tree. Run 'npm install --no-package-lock && npm run build:prod' and commit the changes under public/assets."
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all public/assets)" ]; then
            git status --porcelain --untracked-files=all public/assets
            echo "::error title=Committed bundle is incomplete::The build wrote files under public/assets that are not committed. Run 'npm run build:prod' and commit them."
            exit 1
          fi

<!doctype html>
<!--
  data-ichava-theme: the standalone app owns this document, so <html> carries the theme
  scope as well as the component root. The library stylesheet declares its tokens on
  [data-ichava-theme] rather than :root (FINDINGS N1); this keeps <body>, the bootsplash and
  anything else outside the root themed exactly as before.
-->
<html lang="en" data-ichava-theme>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e7c66" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230e7c66'/%3E%3Cpath d='M12 5 4 9l8 4 8-4-8-4Z M4 15l8 4 8-4 M4 12l8 4 8-4' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Ichava Browser — every icon your Laravel app needs</title>
    <meta
      name="description"
      content="Any SVG, icons and illustrations, from open-source sets. Search, restyle, animate and copy — visual browser, REST API and Blade components for Laravel."
    />
    <link rel="canonical" href="https://github.com/ichava/icon-browser/tree/main/docs" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ichava Browser — every icon your Laravel app needs" />
    <meta property="og:description" content="Icons and illustrations for Laravel: visual browser, REST API, Blade components, treatments and motion." />
    <meta property="og:url" content="https://github.com/ichava/icon-browser/tree/main/docs" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ichava Browser — every icon your Laravel app needs" />
    <meta name="twitter:description" content="Icons and illustrations for Laravel: visual browser, REST API, Blade components, treatments and motion." />
    <!--
      Geist is self-hosted. The @font-face rules live in src/styles/theme.css, which is
      bundled into the render-blocking stylesheet this page links; these preloads only
      start the two fetches at parse time instead of after that stylesheet is parsed.

      This replaced a <link> to fonts.googleapis.com. A third-party stylesheet contributes
      no faces until it arrives, so `document.fonts.ready` -- which the visual suite waits
      on -- resolved against an empty font set and screenshotted the page in a fallback
      face. See the @font-face block in theme.css for the full account.

      `crossorigin` is required even though these are same-origin: font fetches are always
      CORS-mode, and a preload without it is fetched in the wrong mode and downloaded twice.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/GeistMono-Variable.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

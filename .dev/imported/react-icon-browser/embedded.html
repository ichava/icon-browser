<!doctype html>
<html lang="en" dir="ltr" data-host-theme="host-owns-this">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Embedded-mode fixture: a HOST page that mounts the icon browser into part of
      itself. Every value below belongs to the host, and mounting must not change any
      of them. This is the regression test for the whole embedding contract -- the
      browser used to overwrite the html class, the design tokens on <html>, lang,
      dir, document.title, the description meta and the entire query string.

      Not a product page. Referenced only by e2e/embedded.spec.ts.
    -->
    <title>Host Application — Dashboard</title>
    <meta name="description" content="A host page description that the browser must not touch." />
  </head>
  <body style="margin: 0; font-family: system-ui, sans-serif">
    <header id="host-header" style="padding: 12px 16px; background: #111827; color: #f9fafb">
      <strong>Host Application</strong>
      <span style="opacity: 0.7"> — the browser is embedded below</span>
    </header>

    <main style="padding: 16px">
      <p id="host-copy">Host content above the mount.</p>
      <!-- The mount target. Sized so the browser has somewhere to render. -->
      <div id="ichava-mount" style="height: 70vh; border: 1px solid #e5e7eb"></div>
      <p id="host-footer-copy">Host content below the mount.</p>
    </main>

    <script type="module" src="/src/embedded.tsx"></script>
  </body>
</html>

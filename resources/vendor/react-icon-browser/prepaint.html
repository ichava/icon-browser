<style>
  #ichava-prepaint{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff;color:#09090b;font:500 13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .2s ease}
  #ichava-prepaint[data-leaving]{opacity:0;pointer-events:none}
  #ichava-prepaint .ichp-mark{width:44px;height:44px;border-radius:11px;background:#7c3aed;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -8px rgba(124,58,237,.55)}
  #ichava-prepaint .ichp-bar{width:140px;height:3px;border-radius:3px;background:#e4e4e7;overflow:hidden}
  #ichava-prepaint .ichp-bar>i{display:block;width:40%;height:100%;border-radius:3px;background:#7c3aed;animation:ichp-slide 1.1s ease-in-out infinite}
  #ichava-prepaint .ichp-slow{display:none;color:#71717a}
  #ichava-prepaint .ichp-slow a{color:#7c3aed}
  #ichava-prepaint[data-slow] .ichp-slow{display:block}
  @keyframes ichp-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  @media (prefers-color-scheme:dark){#ichava-prepaint{background:#0a0a0b;color:#fafafa}#ichava-prepaint .ichp-bar{background:#26262b}}
  @media (prefers-reduced-motion:reduce){#ichava-prepaint .ichp-bar>i{animation:none;width:100%;opacity:.6}}
</style>
<div id="ichava-prepaint" role="status" aria-live="polite" aria-label="Loading">
  <div class="ichp-mark" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
  </div>
  <div class="ichp-bar" aria-hidden="true"><i></i></div>
  <p class="ichp-slow">Still loading… <a href="">Reload</a></p>
</div>
<script>
  setTimeout(function () {
    var el = document.getElementById('ichava-prepaint');
    if (el && !el.hasAttribute('data-leaving')) el.setAttribute('data-slow', '');
  }, 12000);
</script>

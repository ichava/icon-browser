<style>
  #ichava-prepaint{--ichbs-bg:#0a0a0b;--ichbs-fg:#fafafa;--ichbs-muted:#1b1b1f;--ichbs-muted2:#131316;--ichbs-muted-fg:#a1a1aa;--ichbs-faint-fg:#5c5c64;--ichbs-border:#26262b;--ichbs-accent:#8b5cf6;--ichbs-accent-fg:#fff;--ichbs-accent-soft:rgba(139,92,246,.16);position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:46px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--ichbs-muted2) 0%,var(--ichbs-bg) 62%);color:var(--ichbs-fg);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;transition:opacity .3s ease}
  #ichava-prepaint *{box-sizing:border-box}
  #ichava-prepaint[data-leaving]{opacity:0;pointer-events:none}
  #ichava-prepaint .ichbs__stack{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
  #ichava-prepaint .ichbs__logo{position:relative;width:64px;height:64px;border-radius:19px;background:linear-gradient(155deg,#ad8ef8,var(--ichbs-accent) 72%);color:var(--ichbs-accent-fg);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:ichbs-float 2.6s ease-in-out infinite,ichbs-glow 2.6s ease-in-out infinite}
  #ichava-prepaint .ichbs__logo::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.28),inset 0 -6px 14px -6px rgba(0,0,0,.35);pointer-events:none}
  #ichava-prepaint .ichbs__logo svg{width:32px;height:32px;position:relative}
  #ichava-prepaint .ichbs__wordmark{display:flex;align-items:baseline;gap:8px}
  #ichava-prepaint .ichbs__brand{font-weight:800;font-size:22px;letter-spacing:-.025em}
  #ichava-prepaint .ichbs__suffix{color:var(--ichbs-muted-fg);font-size:18px;font-weight:500}
  #ichava-prepaint .ichbs__brandmeta{display:flex;align-items:center;gap:8px;margin-top:-6px;font-size:10.5px;color:var(--ichbs-faint-fg);flex-wrap:wrap;justify-content:center}
  #ichava-prepaint .ichbs__footer-dot{width:3px;height:3px;border-radius:50%;background:var(--ichbs-border)}
  #ichava-prepaint .ichbs__footer-link{color:var(--ichbs-muted-fg);text-decoration:none}
  #ichava-prepaint .ichbs__progress{min-height:46px;display:flex;flex-direction:column;align-items:inherit;justify-content:center}
  #ichava-prepaint .ichbs__bar-wrap{width:230px;display:flex;flex-direction:column;gap:7px}
  #ichava-prepaint .ichbs__bar-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  #ichava-prepaint .ichbs__msg{flex:1;min-width:0;font-size:11px;color:var(--ichbs-faint-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:start}
  #ichava-prepaint .ichbs__bar{position:relative;width:100%;height:5px;border-radius:3px;background:var(--ichbs-muted);overflow:hidden}
  #ichava-prepaint .ichbs__bar-fill{height:100%;width:40%;border-radius:3px;background:var(--ichbs-accent)}
  #ichava-prepaint .ichbs__bar-shimmer{position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--ichbs-accent-soft),transparent);animation:ichbs-shimmer 1.1s ease-in-out infinite}
  #ichava-prepaint .ichp-slow{display:none;margin:0;font-size:11px;color:var(--ichbs-muted-fg)}
  #ichava-prepaint .ichp-slow a{color:var(--ichbs-accent)}
  #ichava-prepaint[data-slow] .ichp-slow{display:block}
  @keyframes ichbs-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes ichbs-glow{0%,100%{box-shadow:0 12px 34px -8px var(--ichbs-accent-soft),0 0 0 0 var(--ichbs-accent-soft)}50%{box-shadow:0 18px 46px -6px var(--ichbs-accent-soft),0 0 0 12px transparent}}
  @keyframes ichbs-shimmer{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
  @media (prefers-reduced-motion:reduce){#ichava-prepaint *{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
<div id="ichava-prepaint" class="ichbs ichbs--fullpage ichbs--dark ichbs--bg-gradient ichbs--layout-center ichbs--align-center ichbs--indeterminate" role="status" aria-live="polite" aria-busy="true" aria-label="Loading">
  <div class="ichbs__stack">
    <div class="ichbs__logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></div>
    <div class="ichbs__wordmark"><span class="ichbs__brand">Ichava</span><span class="ichbs__suffix">Browser</span></div>
    <div class="ichbs__brandmeta"><span>© Simtabi LLC</span><span class="ichbs__footer-dot"></span><a class="ichbs__footer-link" href="https://simtabi.com" target="_blank" rel="noopener">simtabi.com</a><span class="ichbs__footer-dot"></span><a class="ichbs__footer-link" href="mailto:ichava@simtabi.com">ichava@simtabi.com</a></div>
    <div class="ichbs__progress" aria-hidden="true"><div class="ichbs__bar-wrap"><div class="ichbs__bar-head"><span class="ichbs__msg">Loading</span></div><div class="ichbs__bar"><div class="ichbs__bar-fill"></div><div class="ichbs__bar-shimmer"></div></div></div></div>
    <p class="ichp-slow">Still loading… <a href="">Reload</a></p>
  </div>
</div>
<script>
  setTimeout(function () {
    var el = document.getElementById('ichava-prepaint');
    if (el && !el.hasAttribute('data-leaving')) el.setAttribute('data-slow', '');
  }, 12000);
</script>
